<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study & Enjoy — Daily Study Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f5f9ff;color:#12213b}
header{background:#1264e8;color:white;padding:28px 18px}main{max-width:900px;margin:auto;padding:20px}
.card{background:white;border:1px solid #dfe8f5;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #10203d10}
h1{margin:0 0 7px}.muted{color:#64748b}
.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:180px}
input,select{width:100%;padding:11px;border:1px solid #ccd8e8;border-radius:9px}
.task{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #edf1f6}
.task:last-child{border:0}.task input{width:auto;margin-top:4px}
button{border:0;background:#1264e8;color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer}
.secondary{background:#eef4ff;color:#1264e8}.progress{height:12px;background:#e7edf5;border-radius:20px;overflow:hidden}.bar{height:100%;background:#1264e8;width:0}
.tip{background:#eef7ff;border-left:4px solid #1264e8;padding:12px;border-radius:6px}
@media(max-width:600px){h1{font-size:28px}}
</style>
</head>
<body>
<header><main><h1>📚 Daily Study Planner</h1><div>Study & Enjoy • AKTU B.Tech 1st Year</div></main></header>
<main>
<div class="card">
<h2>Today's Setup</h2>
<div class="row">
<div class="field"><label>Date<br><input id="date" type="date"></label></div>
<div class="field"><label>Main Subject<br><select id="subject"><option>Engineering Mathematics-I</option><option>Basic Electrical Engineering</option><option>Programming for Problem Solving</option><option>Engineering Physics</option><option>Engineering Chemistry</option><option>Environment & Ecology</option><option>Soft Skills</option></select></label></div>
<div class="field"><label>Today's Target<br><input id="target" placeholder="e.g. Unit 2 + 5 questions"></label></div>
</div>
</div>

<div class="card">
<h2>⏱️ Recommended Daily Routine</h2>
<div id="tasks">
<label class="task"><input type="checkbox" onchange="update()"> <span><b>15 min</b> — Revise yesterday's weak topic</span></label>
<label class="task"><input type="checkbox" onchange="update()"> <span><b>50 min</b> — Main concept session</span></label>
<label class="task"><input type="checkbox" onchange="update()"> <span><b>10 min</b> — Break / walk / water</span></label>
<label class="task"><input type="checkbox" onchange="update()"> <span><b>50 min</b> — Second subject / problem solving</span></label>
<label class="task"><input type="checkbox" onchange="update()"> <span><b>10 min</b> — Break</span></label>
<label class="task"><input type="checkbox" onchange="update()"> <span><b>30 min</b> — Practice 5–10 questions</span></label>
<label class="task"><input type="checkbox" onchange="update()"> <span><b>20 min</b> — Formula / definition revision</span></label>
<label class="task"><input type="checkbox" onchange="update()"> <span><b>10 min</b> — Ask AI and clear one doubt</span></label>
<label class="task"><input type="checkbox" onchange="update()"> <span><b>5 min</b> — Write tomorrow's first task</span></label>
</div>
<p><b>Progress: <span id="pct">0%</span></b></p><div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div class="card">
<h2>🎯 Smart Rule</h2>
<div class="tip">If a topic feels difficult: <b>Understand → See one example → Solve 3 easy questions → Solve 2 exam questions → Mark the mistake.</b></div>
</div>

<div class="card">
<h2>📝 Today's Reflection</h2>
<textarea id="notes" style="width:100%;min-height:120px;border:1px solid #ccd8e8;border-radius:9px;padding:11px" placeholder="What did I learn? What is still confusing?"></textarea>
<br><br>
<button onclick="save()">💾 Save Today's Plan</button>
<button class="secondary" onclick="clearPlan()">Reset</button>
<p id="saved" class="muted"></p>
</div>
</main>
<script>
const d=document.getElementById('date');d.valueAsDate=new Date();
function update(){let a=[...document.querySelectorAll('#tasks input')],n=a.filter(x=>x.checked).length,p=Math.round(n/a.length*100);document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%'}
function save(){localStorage.setItem('dailyPlan',JSON.stringify({date:d.value,subject:subject.value,target:target.value,notes:notes.value,checks:[...document.querySelectorAll('#tasks input')].map(x=>x.checked)}));document.getElementById('saved').textContent='✅ Plan saved on this device.'}
function clearPlan(){localStorage.removeItem('dailyPlan');location.reload()}
(function(){let x=JSON.parse(localStorage.getItem('dailyPlan')||'null');if(!x)return;d.value=x.date||d.value;subject.value=x.subject||subject.value;target.value=x.target||'';notes.value=x.notes||'';[...document.querySelectorAll('#tasks input')].forEach((e,i)=>e.checked=!!(x.checks||[])[i]);update()})()
</script>
</body>
</html>
