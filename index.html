
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Study & Enjoy - AKTU B.Tech study material, notes, PYQs, online tests, syllabus, assignments and AI study tools." />
  <title>Study & Enjoy | AKTU B.Tech Study Material</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f4f7ff;
      --bg-soft: #eef1ff;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-solid: #ffffff;
      --surface-alt: #f8f9ff;
      --ink: #172554;
      --ink-soft: #34426b;
      --muted: #7280a5;
      --line: rgba(68, 83, 145, 0.14);
      --primary: #315bea;
      --primary-dark: #233db5;
      --secondary: #7c3aed;
      --cyan: #0ea5e9;
      --green: #11a879;
      --yellow: #f59e0b;
      --red: #ef476f;
      --shadow: 0 22px 60px rgba(45, 60, 140, 0.13);
      --shadow-soft: 0 12px 30px rgba(45, 60, 140, 0.09);
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --header-height: 78px;
      --transition: 220ms ease;
    }

    [data-theme="dark"] {
      --bg: #0c1024;
      --bg-soft: #111735;
      --surface: rgba(21, 28, 61, 0.88);
      --surface-solid: #151c3d;
      --surface-alt: #1b244c;
      --ink: #f2f5ff;
      --ink-soft: #c8d0ed;
      --muted: #9aa7cb;
      --line: rgba(190, 201, 255, 0.14);
      --primary: #6e8dff;
      --primary-dark: #94aaff;
      --secondary: #a78bfa;
      --cyan: #38bdf8;
      --green: #3cd6a1;
      --yellow: #fbbf24;
      --red: #fb7185;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
      --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(90, 115, 255, 0.15), transparent 28rem),
        radial-gradient(circle at 93% 10%, rgba(177, 115, 255, 0.14), transparent 25rem),
        linear-gradient(145deg, var(--bg), var(--bg-soft));
      font-family: "DM Sans", sans-serif;
      transition: background var(--transition), color var(--transition);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.18;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(91, 109, 174, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91, 109, 174, 0.08) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    .app-shell {
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin-inline: auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--header-height);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-solid) 78%, transparent);
      backdrop-filter: blur(22px);
    }

    .header-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: white;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 700;
      background:
        linear-gradient(135deg, #355bea, #7c3aed 68%, #ec4899);
      box-shadow: 0 10px 22px rgba(78, 76, 220, 0.3);
    }

    .brand-copy {
      display: grid;
      gap: 1px;
    }

    .brand-name {
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-link,
    .more-toggle {
      position: relative;
      padding: 10px 11px;
      color: var(--muted);
      border-radius: 10px;
      background: transparent;
      font-size: 0.84rem;
      font-weight: 700;
      transition: color var(--transition), background var(--transition), transform var(--transition);
    }

    .nav-link:hover,
    .nav-link.active,
    .more-toggle:hover,
    .more-toggle.active {
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, transparent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      transition: transform var(--transition), border-color var(--transition), color var(--transition);
    }

    .icon-btn:hover {
      color: var(--primary);
      border-color: color-mix(in srgb, var(--primary) 40%, var(--line));
      transform: translateY(-2px);
    }

    .menu-toggle {
      display: none;
    }

    .more-wrap {
      position: relative;
    }

    .more-menu {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: 210px;
      padding: 8px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-solid);
      box-shadow: var(--shadow-soft);
      transition: opacity var(--transition), transform var(--transition), visibility var(--transition);
    }

    .more-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .more-menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      color: var(--ink-soft);
      border-radius: 10px;
      background: transparent;
      text-align: left;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .more-menu button:hover {
      color: var(--primary);
      background: var(--bg-soft);
    }

    main {
      padding: 38px 0 80px;
    }

    .page {
      display: none;
      animation: pageIn 440ms ease both;
    }

    .page.active {
      display: block;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      position: relative;
      min-height: 540px;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
      align-items: center;
      gap: 42px;
      padding: 56px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(125deg, rgba(41, 84, 224, 0.96), rgba(93, 56, 193, 0.95) 58%, rgba(175, 54, 154, 0.92)),
        radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.27), transparent 17rem);
      box-shadow: 0 26px 70px rgba(62, 56, 190, 0.3);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero::before {
      width: 510px;
      height: 510px;
      right: -220px;
      top: -180px;
    }

    .hero::after {
      width: 380px;
      height: 380px;
      left: -225px;
      bottom: -250px;
    }

    .hero-content,
    .hero-visual {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.11);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #86efac;
      box-shadow: 0 0 0 5px rgba(134, 239, 172, 0.13);
    }

    .hero h1 {
      max-width: 680px;
      margin: 22px 0 14px;
      color: white;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(3rem, 7vw, 5.8rem);
      font-weight: 700;
      line-height: 0.97;
      letter-spacing: -0.08em;
    }

    .hero h1 span {
      color: #a7f3d0;
    }

    .hero-tagline {
      max-width: 570px;
      color: rgba(255, 255, 255, 0.81);
      font-size: clamp(1rem, 2vw, 1.22rem);
      line-height: 1.7;
    }

    .search-wrap {
      position: relative;
      margin-top: 28px;
    }

    .search-box {
      width: 100%;
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 8px 7px 19px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .search-box .search-symbol {
      color: rgba(255, 255, 255, 0.82);
      font-size: 1.3rem;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      color: white;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 0.95rem;
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.68);
    }

    .search-submit {
      min-height: 44px;
      padding: 0 17px;
      color: #20328f;
      border-radius: 12px;
      background: white;
      font-weight: 800;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .search-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 22px rgba(16, 21, 91, 0.2);
    }

    .search-results {
      position: absolute;
      top: calc(100% + 9px);
      left: 0;
      z-index: 25;
      width: 100%;
      max-height: 370px;
      display: none;
      padding: 8px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-solid);
      box-shadow: var(--shadow);
    }

    .search-results.open {
      display: grid;
      gap: 5px;
    }

    .result-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 14px;
      color: var(--ink);
      border-radius: 11px;
      background: transparent;
      text-align: left;
    }

    .result-item:hover {
      background: var(--bg-soft);
    }

    .result-title {
      display: block;
      margin-bottom: 3px;
      font-weight: 800;
    }

    .result-meta {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .result-type {
      flex-shrink: 0;
      padding: 5px 8px;
      color: var(--primary);
      border-radius: 999px;
      background: color-mix(in srgb, var(--primary) 11%, transparent);
      font-size: 0.68rem;
      font-weight: 800;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 23px;
    }

    .quick-btn {
      padding: 10px 13px;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 0.78rem;
      font-weight: 800;
      transition: transform var(--transition), background var(--transition);
    }

    .quick-btn:hover {
      background: rgba(255, 255, 255, 0.23);
      transform: translateY(-3px);
    }

    .hero-visual {
      min-height: 360px;
      display: grid;
      place-items: center;
    }

    .dashboard-orbit {
      position: relative;
      width: min(100%, 430px);
      aspect-ratio: 1;
    }

    .orbit-ring {
      position: absolute;
      inset: 7%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: spin 24s linear infinite;
    }

    .orbit-ring::before,
    .orbit-ring::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #a7f3d0;
      box-shadow: 0 0 22px #a7f3d0;
    }

    .orbit-ring::before {
      top: 10%;
      left: 14%;
    }

    .orbit-ring::after {
      right: 6%;
      bottom: 28%;
      background: #fbbf24;
      box-shadow: 0 0 22px #fbbf24;
    }

    .orbit-ring.second {
      inset: 18%;
      border-style: dashed;
      animation-direction: reverse;
      animation-duration: 30s;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hero-panel {
      position: absolute;
      inset: 20% 7%;
      display: grid;
      align-content: center;
      gap: 14px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.23);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow: 0 24px 50px rgba(23, 21, 100, 0.2);
      backdrop-filter: blur(16px);
    }

    .hero-panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .hero-panel-label {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hero-panel-value {
      color: white;
      font-family: "Space Grotesk", sans-serif;
      font-size: 2rem;
      font-weight: 700;
    }

    .hero-panel-badge {
      padding: 6px 9px;
      color: #14532d;
      border-radius: 999px;
      background: #a7f3d0;
      font-size: 0.68rem;
      font-weight: 900;
    }

    .mock-progress {
      height: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }

    .mock-progress span {
      display: block;
      width: 72%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #a7f3d0, #38bdf8);
    }

    .mock-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .mock-card {
      min-height: 70px;
      display: grid;
      align-content: center;
      gap: 4px;
      padding: 11px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.09);
    }

    .mock-card strong {
      color: white;
      font-size: 1.05rem;
    }

    .mock-card span {
      color: rgba(255, 255, 255, 0.57);
      font-size: 0.66rem;
    }

    .floating-chip {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 13px;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 13px 28px rgba(25, 26, 101, 0.18);
      backdrop-filter: blur(12px);
      font-size: 0.75rem;
      font-weight: 800;
      animation: float 4s ease-in-out infinite;
    }

    .floating-chip:nth-child(2) {
      top: 8%;
      right: 4%;
      animation-delay: -1s;
    }

    .floating-chip:nth-child(3) {
      bottom: 11%;
      left: 3%;
      animation-delay: -2.1s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-9px);
      }
    }

    .section-block {
      margin-top: 58px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .section-heading h2,
    .page-heading h1 {
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: -0.055em;
    }

    .section-heading h2 {
      font-size: clamp(1.7rem, 3vw, 2.35rem);
    }

    .section-heading p,
    .page-heading p {
      max-width: 670px;
      margin-top: 7px;
      color: var(--muted);
      line-height: 1.65;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .text-link:hover {
      color: var(--secondary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 13px;
    }

    .stat-card {
      position: relative;
      min-height: 138px;
      display: grid;
      align-content: space-between;
      padding: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
    }

    .stat-card::after {
      content: "";
      position: absolute;
      width: 84px;
      height: 84px;
      right: -32px;
      bottom: -35px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--stat-color) 18%, transparent);
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .stat-number {
      color: var(--stat-color);
      font-family: "Space Grotesk", sans-serif;
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.06em;
    }

    .updates-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr 0.8fr;
      gap: 15px;
    }

    .update-card {
      position: relative;
      min-height: 188px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .update-card.featured {
      color: white;
      border: 0;
      background: linear-gradient(140deg, #315bea, #7c3aed);
    }

    .update-card.featured p,
    .update-card.featured .update-date {
      color: rgba(255, 255, 255, 0.75);
    }

    .update-card::after {
      content: "";
      position: absolute;
      right: -28px;
      bottom: -42px;
      width: 150px;
      height: 150px;
      border: 1px solid currentColor;
      border-radius: 50%;
      opacity: 0.1;
    }

    .update-date {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .update-card h3 {
      max-width: 390px;
      margin: 12px 0 8px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.25rem;
      line-height: 1.18;
    }

    .update-card p {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .update-action {
      align-self: flex-start;
      margin-top: 18px;
      color: inherit;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .folder-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .folder-card {
      position: relative;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 19px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .folder-card:hover {
      border-color: color-mix(in srgb, var(--folder-color) 40%, var(--line));
      box-shadow: var(--shadow);
      transform: translateY(-6px);
    }

    .folder-card::before {
      content: "";
      position: absolute;
      top: -35px;
      right: -32px;
      width: 120px;
      height: 120px;
      border-radius: 40%;
      background: color-mix(in srgb, var(--folder-color) 14%, transparent);
      transform: rotate(22deg);
    }

    .folder-icon {
      position: relative;
      z-index: 1;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      color: white;
      border-radius: 14px;
      background: var(--folder-color);
      box-shadow: 0 10px 20px color-mix(in srgb, var(--folder-color) 25%, transparent);
      font-size: 1.25rem;
    }

    .folder-card h3 {
      position: relative;

      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 9px 20px color-mix(in srgb, var(--primary) 19%, transparent);
      font-size: 0.8rem;
      font-weight: 800;
